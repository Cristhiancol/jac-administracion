<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D4A7A" />
      <stop offset="50%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#1A5A94" />
    </linearGradient>
    <linearGradient id="gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E8B830" />
      <stop offset="40%" stop-color="#D99B00" />
      <stop offset="100%" stop-color="#C88A00" />
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D4070" />
      <stop offset="50%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#0D4070" />
    </linearGradient>
    <path id="topText" d="M 28,100 A 72,72 0 0,1 172,100" />
    <path id="bottomText" d="M 38,105 A 65,65 0 0,0 162,105" />
  </defs>

  <!-- Outer Blue Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#blueRing)" />

  <!-- Top Curved Text -->
  <text fill="#FFFFFF" font-size="15" font-weight="800" font-family="Arial, sans-serif" letter-spacing="3">
    <textPath href="#topText" startOffset="50%" text-anchor="middle">TODOS SOMOS COMUNIDAD</textPath>
  </text>

  <!-- Bottom Curved Text -->
  <text fill="#FFFFFF" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="5">
    <textPath href="#bottomText" startOffset="50%" text-anchor="middle">BELLAVISTA</textPath>
  </text>

  <!-- Inner White Circle -->
  <circle cx="100" cy="100" r="64" fill="#FFFFFF" />
  <circle cx="100" cy="100" r="62" fill="none" stroke="#1B8A5A" stroke-width="2" />

  <!-- Golden Handshake -->
  <g transform="translate(100, 98) scale(1.15)">
    <path d="M-42 8 C-42 8,-38 -4,-28 -8 L-14 -14 C-10 -16,-6 -14,-4 -10 L-2 -4 C0 -1,-4 4,-8 6 L-18 12 C-24 14,-32 14,-42 8 Z" fill="url(#gold)" stroke="#A67C00" stroke-width="0.8" />
    <path d="M42 8 C42 8,38 -4,28 -8 L14 -14 C10 -16,6 -14,4 -10 L2 -4 C0 -1,4 4,8 6 L18 12 C24 14,32 14,42 8 Z" fill="url(#gold)" stroke="#A67C00" stroke-width="0.8" />
    <path d="M-14 -14 C-8 -18,8 -18,14 -14 L8 -6 C4 -2,-4 -2,-8 -6 Z" fill="url(#gold)" stroke="#A67C00" stroke-width="0.6" />
    <path d="M-10 2 Q-6 6,0 6 Q6 6,10 2" stroke="#A67C00" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M-8 8 Q-4 12,0 12 Q4 12,8 8" stroke="#A67C00" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M-5 14 Q-2 17,0 17 Q2 17,5 14" stroke="#A67C00" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M-18 -2 C-16 -6,-12 -8,-8 -6" stroke="#A67C00" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M18 -2 C16 -6,12 -8,8 -6" stroke="#A67C00" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Bottom Ribbon -->
  <path d="M38 178 L32 195 L50 188 Z" fill="url(#ribbon)" />
  <path d="M162 178 L168 195 L150 188 Z" fill="url(#ribbon)" />
  <path d="M40 168 Q100 180,160 168 L162 182 Q100 194,38 182 Z" fill="url(#ribbon)" stroke="#0A3A66" stroke-width="1" />
  <text x="100" y="180" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800" font-family="Georgia, serif" font-style="italic" letter-spacing="3">1991</text>
</svg>
